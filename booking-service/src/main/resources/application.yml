spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing
    username: app
    password: secret
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-it-0123456789}
booking:
  payment-timeout: 15m

    