spring:
  mvc:
    problemdetails:
      enabled: true
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing
    username: app
    password: secret
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-it-0123456789}
booking:
  hold-duration: 2m

    